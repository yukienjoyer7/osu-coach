[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osucoach"
version = "0.1.0"
description = "osu!standard coaching CLI: fetches osu! API v2 data for an agent coach"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osucoach = "osucoach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osucoach = ["COACHING.md"]
